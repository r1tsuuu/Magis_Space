server.port = 9999
spring.main.allow-bean-definition-overriding=true
spring.jersey.application-path=/api

# createDatabaseIfNotExist: no need to create magis_space_db in phpMyAdmin first.
# serverTimezone: avoids XAMPP's "server time zone value is unrecognized" error.
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/magis_space_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = false
spring.jpa.open-in-view = false

notification.api.url = http://localhost:8080/
