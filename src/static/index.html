<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magis Space · Find a vacant study room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">M</div>
    <div>
      <h1>Magis Space</h1>
      <p>Vacant study rooms at Ateneo</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="updated" id="updated" title="The page refreshes every 30 seconds">
      <span class="dot"></span><span id="updatedText">Loading…</span>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh now" title="Refresh now">&#x21bb;</button>
    </div>
    <button class="bell" id="bellBtn" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
    <div class="who">
      <label for="studentSelect">I am</label>
      <select id="studentSelect"></select>
      <button class="btn ghost small" id="newStudentBtn" type="button">+ New</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="col-main">
    <div class="panel" id="mapPanel">
      <div class="panel-head">
        <div>
          <nav class="crumbs" id="crumbs"></nav>
          <h2 id="mapTitle">Campus</h2>
        </div>
        <div class="legend" aria-label="Legend">
          <span><i class="sw vacant"></i>Vacant</span>
          <span><i class="sw occupied"></i>Occupied</span>
          <span><i class="sw unverified"></i>Unverified (report over 1 h old)</span>
          <span><i class="sw nodata"></i>No data</span>
        </div>
      </div>
      <div class="floors" id="floors" hidden></div>
      <div class="map" id="map"></div>
    </div>

    <div class="panel" id="listPanel">
      <div class="panel-head"><h2>Rooms</h2><span class="muted" id="listCount"></span></div>
      <form class="filters" id="filters" autocomplete="off">
        <label>Building<select id="fBuilding"><option value="">All buildings</option></select></label>
        <label>Min. capacity<input id="fCap" type="number" min="1" inputmode="numeric" placeholder="Any"></label>
        <label>Amenity<select id="fAmenity"><option value="">Any</option></select></label>
        <label>Status<select id="fStatus">
          <option value="">Any</option><option value="VACANT">Vacant</option><option value="OCCUPIED">Occupied</option>
          <option value="UNVERIFIED">Unverified</option><option value="NO_DATA">No data</option>
          <option value="LIKELY">Likely free (no class now)</option></select></label>
        <label>Nearest vacant from<select id="fFrom"><option value="">Not sorted</option></select></label>
      </form>
      <div class="rooms" id="rooms"></div>
    </div>
  </section>

  <aside class="col-side">
    <div class="panel" id="notifPanel">
      <div class="panel-head"><h2>Notifications</h2><span class="pill-count" id="notifCount"></span></div>
      <div id="notifList" class="stack"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Notify me</h2></div>
      <p class="muted small-text">Get an SMS and an alert here when a matching room becomes vacant.</p>
      <form id="subForm" class="form">
        <label>Building<select id="sBuilding" required><option value="">Choose a building…</option></select></label>
        <div class="row2">
          <label>Min. capacity<input id="sCap" type="number" min="1" inputmode="numeric" placeholder="Optional"></label>
          <label>Amenity<select id="sAmenity"><option value="">Optional</option></select></label>
        </div>
        <button class="btn primary" type="submit">Notify me</button>
      </form>
      <h3>My subscriptions</h3>
      <div id="subList" class="stack"></div>
    </div>
  </aside>
</main>

<dialog id="studentDialog">
  <form id="studentForm" class="form" method="dialog">
    <h2>New student</h2>
    <label>Name<input id="nsName" required maxlength="100" autocomplete="name"></label>
    <label>Email<input id="nsEmail" type="email" required autocomplete="email"></label>
    <label>Mobile number<input id="nsPhone" required placeholder="09171234567" autocomplete="tel"></label>
    <div class="actions">
      <button class="btn ghost" type="button" id="nsCancel">Cancel</button>
      <button class="btn primary" type="submit">Create</button>
    </div>
  </form>
</dialog>

<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
